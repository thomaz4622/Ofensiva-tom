name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Compilar
        run: |
          gradle assembleDebug --no-daemon --console=plain > log.txt 2>&1
      - name: Mostrar erro
        if: failure()
        run: |
          grep -E -A12 "^e:|What went wrong" log.txt | head -60
      - uses: actions/upload-artifact@v4
        with:
          name: ofensiva-apk
          path: app/build/outputs/apk/debug/app-debug.apk
